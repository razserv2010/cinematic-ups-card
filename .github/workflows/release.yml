name: Validate and publish card
on:
  push:
    branches: [main]
    paths: ['dist/**', 'VERSION', 'tests/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinematic-ups-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate card
        run: |
          node --check dist/cinematic-ups-card.js
          node tests/card.test.cjs
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: card-previews
          path: preview*.png
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create "v$VERSION" dist/cinematic-ups-card.js --target "$GITHUB_SHA" --title "Cinematic UPS Card v$VERSION" --notes-file RELEASE_NOTES.md
